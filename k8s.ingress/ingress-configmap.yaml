apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configuration
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
data:
  # Rate Limiting Globais
  limit-req-status-code: "429"
  limit-conn-status-code: "429"
  
  # Timeouts para evitar slow requests
  client-body-timeout: "10"
  client-header-timeout: "10"
  keepalive-timeout: "10"
  send-timeout: "10"
  
  # Tamanho máximo do body
  proxy-body-size: "10m"
  client-max-body-size: "10m"
  
  # Buffers para prevenir buffer overflow attacks
  client-body-buffer-size: "1M"
  client-header-buffer-size: "1k"
  large-client-header-buffers: "4 8k"
  
  # Headers de segurança
  hide-headers: "X-Powered-By,Server"
  add-headers: "ingress-nginx/custom-headers"
  
  # SSL/TLS
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"
  ssl-prefer-server-ciphers: "true"
  
  # Real IP
  use-forwarded-headers: "true"
  compute-full-forwarded-for: "true"
  use-proxy-protocol: "false"
  
  # Connection limits
  limit-conn-zone-variable: "$binary_remote_addr"
  
  # Logs
  log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id'
  
  # Anti-DDoS
  enable-modsecurity: "false"
  enable-owasp-modsecurity-crs: "false"