apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: auth
type: Opaque
stringData:
  database-connection: "Host=postgres.database.svc.cluster.local;Port=5432;Database=risa_auth;Username=postgres;Password=supersecret"
  jwt-secret-key: "your-super-secret-key-min-32-chars-long-change-in-production"
  google-client-id: "your-google-client-id.apps.googleusercontent.com"