apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: risa-infra
data:
  rabbitmq.conf: |
    default_user = admin
    default_pass = admin123
    loopback_users.guest = false

    management.tcp.port = 15672
    management.tcp.ip = 0.0.0.0
    management.load_definitions = /etc/rabbitmq/definitions.json

  enabled_plugins: |
    [rabbitmq_management].

  definitions.json: |
    {
      "vhosts": [
        { "name": "/" }
      ],
      "users": [
        {
          "name": "admin",
          "password": "admin123",
          "tags": "administrator"
        }
      ],
      "permissions": [
        {
          "user": "admin",
          "vhost": "/",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        }
      ],
      "exchanges": [
        {
          "name": "billing.events",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false
        }
      ],
      "queues": [
        {
          "name": "gateway.billing",
          "vhost": "/",
          "durable": true,
          "auto_delete": false
        }
      ],
      "bindings": [
        {
          "source": "billing.events",
          "vhost": "/",
          "destination": "gateway.billing",
          "destination_type": "queue",
          "routing_key": "tenant.payment.*"
        }
      ]
    }