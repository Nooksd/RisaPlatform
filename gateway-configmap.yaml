apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: gateway
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Jwt__Issuer: "RisaPlatform"
  Jwt__Audience: "RisaPlatform"
  Redis__ConnectionString: "redis.risa-infra.svc.cluster.local:6379"
  RabbitMq__Host: "rabbitmq.risa-infra.svc.cluster.local"
  RabbitMq__Port: "5672"
  RabbitMq__Username: "guest"