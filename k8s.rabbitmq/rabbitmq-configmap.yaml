apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: risa-infra
data:
  rabbitmq.conf: |
    default_user = admin
    default_pass = admin123
    loopback_users.guest = false

    management.tcp.port = 15672
    management.tcp.ip = 0.0.0.0
    management.load_definitions = /etc/rabbitmq/definitions.json

  enabled_plugins: |
    [rabbitmq_management].

  definitions.json: |
    {
      "vhosts": [
        { "name": "/" }
      ],
      "users": [
        {
          "name": "admin",
          "password": "admin123",
          "tags": "administrator"
        }
      ],
      "permissions": [
        {
          "user": "admin",
          "vhost": "/",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        }
      ],
      "exchanges": [
        {
          "name": "billing.events",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false
        },
        {
          "name": "billing.events.dlx",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false
        }
      ],
      "queues": [
        {
          "name": "gateway.billing",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "billing.events.dlx",
            "x-dead-letter-routing-key": "gateway.billing.failed"
          }
        },
        {
          "name": "gateway.billing.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-message-ttl": 86400000,
            "x-max-length": 10000
          }
        },
        {
          "name": "auth.billing",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-dead-letter-exchange": "billing.events.dlx",
            "x-dead-letter-routing-key": "auth.billing.failed"
          }
        },
        {
          "name": "auth.billing.dlq",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-message-ttl": 86400000,
            "x-max-length": 10000
          }
        }
      ],
      "bindings": [
        {
          "source": "billing.events",
          "vhost": "/",
          "destination": "gateway.billing",
          "destination_type": "queue",
          "routing_key": "TenantPaymentConfirmedEvent"
        },
        {
          "source": "billing.events",
          "vhost": "/",
          "destination": "gateway.billing",
          "destination_type": "queue",
          "routing_key": "TenantGracePeriodGrantedEvent"
        },
        {
          "source": "billing.events",
          "vhost": "/",
          "destination": "auth.billing",
          "destination_type": "queue",
          "routing_key": "TenantPaymentConfirmedEvent"
        },
        {
          "source": "billing.events",
          "vhost": "/",
          "destination": "auth.billing",
          "destination_type": "queue",
          "routing_key": "TenantGracePeriodGrantedEvent"
        },
        {
          "source": "billing.events.dlx",
          "vhost": "/",
          "destination": "gateway.billing.dlq",
          "destination_type": "queue",
          "routing_key": "gateway.billing.failed"
        },
        {
          "source": "billing.events.dlx",
          "vhost": "/",
          "destination": "auth.billing.dlq",
          "destination_type": "queue",
          "routing_key": "auth.billing.failed"
        }
      ]
    }