kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: risa-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Ingress HTTP
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # Ingress HTTPS
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # RabbitMQ Management
      - containerPort: 30672
        hostPort: 15672
        protocol: TCP
      # PostgreSQL (para acesso direto)
      - containerPort: 30432
        hostPort: 5432
        protocol: TCP
  - role: worker
  - role: worker