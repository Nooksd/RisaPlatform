apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: auth-service
  labels:
    app: auth-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          image: risa/auth-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__AuthDb
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: database-connection
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret-key
            - name: Jwt__Issuer
              value: "risa-auth-api"
            - name: Jwt__Audience
              value: "risa-platform"
            - name: OAuth__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: google-client-id
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3